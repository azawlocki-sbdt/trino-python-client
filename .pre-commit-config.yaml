repos:
  - repo: "https://github.com/PyCQA/flake8"
    rev: "7.1.1"
    hooks:
      - id: "flake8"
        name: "Python: analysis"

  - repo: "https://github.com/pre-commit/mirrors-mypy"
    rev: "v1.13.0"
    hooks:
      - id: "mypy"
        name: "Python: types"
        # The hook runs in an isolated environment, so the stubs for the
        # third-party libraries used in annotated modules must be installed
        # explicitly, otherwise they resolve to Any and are not checked.
        additional_dependencies:
          - "types-requests"
          - "types-tzlocal"

  - repo: "https://github.com/asottile/reorder-python-imports"
    rev: "v3.14.0"
    hooks:
      - id: "reorder-python-imports"
        name: "Python: imports"
        args: ["--py39-plus"]

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "v5.0.0"
    hooks:
      - id: "check-yaml"
        name: "YAML: syntax"
        args: ["--unsafe"]
      - id: "end-of-file-fixer"
        name: "All: newlines at EOF"
      - id: "trailing-whitespace"
        name: "All: no trailing whitespaces"
        exclude_types:
          - "markdown"
      - id: "check-case-conflict"
        name: "All: case-insensitive filesystem conflicts"
